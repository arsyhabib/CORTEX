<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CORTEX DESIGN LIBRARY - Batch 0 + 24 Pages</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #0a0a0a;
      font-family: "SF Pro Display", "Inter", -apple-system, sans-serif;
    }
/* CORTEX EDUCATION — Master Stylesheet */
/* Glass Effects, Animations, Backgrounds */

* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --cortex-tilt-x: 0;
  --cortex-tilt-y: 0;
  --cortex-depth-x: 0px;
  --cortex-depth-y: 0px;
  --cortex-wallpaper-shift-x: 0px;
  --cortex-wallpaper-shift-y: 0px;
  --cortex-card-tilt-x: 0deg;
  --cortex-card-tilt-y: 0deg;
  --cortex-card-shift-x: 0px;
  --cortex-card-shift-y: 0px;
  --cortex-button-tilt-x: 0deg;
  --cortex-button-tilt-y: 0deg;
  --cortex-button-shift-x: 0px;
  --cortex-button-shift-y: 0px;
  --cortex-shake-force: 0;
  --cortex-shake-x: 0px;
  --cortex-shake-y: 0px;
  --cortex-shake-x-neg: 0px;
  --cortex-shake-y-pos: 0px;
  --cortex-shake-rot: 0deg;
  --cortex-shake-rot-neg: 0deg;
  --cortex-shake-rest: 0deg;
}

/* ═══════════════════════════════════════════
   KEYFRAME ANIMATIONS
   ═══════════════════════════════════════════ */

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}

@keyframes float-slow {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  33% { transform: translateY(-12px) rotate(1deg); }
  66% { transform: translateY(-6px) rotate(-1deg); }
}

@keyframes pulse-glow {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.05); }
}

@keyframes slide-up {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes slide-down {
  0% { opacity: 0; transform: translateY(-20px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes scale-in {
  0% { opacity: 0; transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes scale-bounce {
  0% { opacity: 0; transform: scale(0.5); }
  60% { transform: scale(1.08); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes gradient-shift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes rotate-slow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes border-dance {
  0% { border-color: rgba(255,255,255,0.15); }
  50% { border-color: rgba(255,255,255,0.35); }
  100% { border-color: rgba(255,255,255,0.15); }
}

@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(var(--glow-rgb), 0.2); }
  50% { box-shadow: 0 0 40px rgba(var(--glow-rgb), 0.5); }
}

@keyframes text-glow {
  0%, 100% { text-shadow: 0 0 10px currentColor; }
  50% { text-shadow: 0 0 25px currentColor, 0 0 40px currentColor; }
}

@keyframes morph-blob {
  0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
  25% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
  50% { border-radius: 50% 60% 30% 60% / 40% 70% 60% 30%; }
  75% { border-radius: 60% 30% 60% 40% / 70% 40% 50% 60%; }
}

@keyframes mosaic-tile {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

@keyframes stagger-in {
  0% { opacity: 0; transform: translateY(20px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes ripple {
  0% { transform: scale(0); opacity: 0.5; }
  100% { transform: scale(4); opacity: 0; }
}

@keyframes typewriter {
  from { width: 0; }
  to { width: 100%; }
}

@keyframes blink-cursor {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

@keyframes scanline {
  0% { top: -10%; }
  100% { top: 110%; }
}

@keyframes particle-rise {
  0% { transform: translateY(100%) scale(0); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 0.6; }
  100% { transform: translateY(-100vh) scale(1); opacity: 0; }
}

@keyframes wave-flow {
  0% { transform: translateX(0) translateY(0); }
  50% { transform: translateX(-25%) translateY(-5%); }
  100% { transform: translateX(0) translateY(0); }
}

@keyframes iris-open {
  0% { clip-path: circle(0% at 50% 50%); opacity: 0; }
  100% { clip-path: circle(75% at 50% 50%); opacity: 1; }
}

@keyframes slide-right {
  0% { opacity: 0; transform: translateX(-30px); }
  100% { opacity: 1; transform: translateX(0); }
}

@keyframes counter-up {
  0% { opacity: 0; transform: translateY(15px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes shine-sweep {
  0% { left: -100%; }
  100% { left: 200%; }
}

@keyframes gold-shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}

@keyframes buttery-pop {
  0% { opacity: 0; transform: translateY(24px) scale(0.92); filter: blur(8px); }
  55% { opacity: 1; transform: translateY(-4px) scale(1.025); filter: blur(0); }
  78% { transform: translateY(2px) scale(0.992); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes bubbly-breathe {
  0%, 100% { transform: translateY(0) scale(1); border-radius: 20px; }
  35% { transform: translateY(-3px) scale(1.006); border-radius: 24px; }
  70% { transform: translateY(1px) scale(0.998); border-radius: 18px; }
}

@keyframes jelly-press {
  0% { transform: scale(1); }
  32% { transform: scale(0.965, 1.035); }
  62% { transform: scale(1.018, 0.982); }
  100% { transform: scale(1); }
}

@keyframes soft-wobble {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  25% { transform: rotate(-0.8deg) translateY(-2px); }
  55% { transform: rotate(0.7deg) translateY(1px); }
  80% { transform: rotate(-0.3deg) translateY(-1px); }
}

@keyframes liquid-sheen {
  0% { transform: translateX(-120%) skewX(-18deg); opacity: 0; }
  18% { opacity: 0.65; }
  46% { opacity: 0; }
  100% { transform: translateX(220%) skewX(-18deg); opacity: 0; }
}

@keyframes pill-jiggle {
  0% { transform: scale(1) rotate(0deg); }
  35% { transform: scale(1.08, 0.94) rotate(-1.2deg); }
  65% { transform: scale(0.98, 1.04) rotate(0.8deg); }
  100% { transform: scale(1) rotate(0deg); }
}

@keyframes cortex-wallpaper-drift {
  0%, 100% { transform: translate3d(var(--wallpaper-x, 0px), var(--wallpaper-y, 0px), 0) scale(1.07) rotate(0deg); }
  45% { transform: translate3d(calc(var(--wallpaper-x, 0px) * 1.4 + 10px), calc(var(--wallpaper-y, 0px) * 1.2 - 12px), 0) scale(1.105) rotate(0.7deg); }
  72% { transform: translate3d(calc(var(--wallpaper-x, 0px) * 0.7 - 7px), calc(var(--wallpaper-y, 0px) * 1.5 + 8px), 0) scale(1.085) rotate(-0.45deg); }
}

@keyframes cortex-wallpaper-bloom {
  0%, 100% { opacity: 0.36; transform: translate(-50%, -50%) scale(0.82); filter: blur(22px); }
  50% { opacity: 0.62; transform: translate(-50%, -50%) scale(1.14); filter: blur(16px); }
}

@keyframes cortex-ripple-pop {
  0% { opacity: 0.46; transform: translate(-50%, -50%) scale(0.12); }
  65% { opacity: 0.22; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(2.8); }
}

@keyframes cortex-live-float-a {
  0%, 100% { transform: translate3d(var(--wallpaper-x,0px), var(--wallpaper-y,0px), 0) scale(0.96) rotate(0deg); }
  33% { transform: translate3d(calc(var(--wallpaper-x,0px) * -0.7 + 22px), calc(var(--wallpaper-y,0px) * 0.8 - 18px), 0) scale(1.04) rotate(7deg); }
  66% { transform: translate3d(calc(var(--wallpaper-x,0px) * 0.9 - 18px), calc(var(--wallpaper-y,0px) * -0.6 + 20px), 0) scale(1.01) rotate(-5deg); }
}

@keyframes cortex-live-float-b {
  0%, 100% { transform: translate3d(0,0,0) rotate(var(--facet-rotate,0deg)) scale(1); }
  45% { transform: translate3d(28px,-18px,0) rotate(calc(var(--facet-rotate,0deg) + 10deg)) scale(1.05); }
  72% { transform: translate3d(-18px,16px,0) rotate(calc(var(--facet-rotate,0deg) - 6deg)) scale(0.98); }
}

@keyframes cortex-live-ribbon-drift {
  0%, 100% { transform: translate3d(calc(var(--wallpaper-x,0px) * 0.35), calc(var(--wallpaper-y,0px) * 0.22), 0) rotate(var(--ribbon-rotate,0deg)) scale(1); }
  38% { transform: translate3d(calc(var(--wallpaper-x,0px) * -0.42 + 18px), calc(var(--wallpaper-y,0px) * 0.40 - 20px), 0) rotate(calc(var(--ribbon-rotate,0deg) + 5deg)) scale(1.04); }
  70% { transform: translate3d(calc(var(--wallpaper-x,0px) * 0.20 - 22px), calc(var(--wallpaper-y,0px) * -0.36 + 16px), 0) rotate(calc(var(--ribbon-rotate,0deg) - 4deg)) scale(0.99); }
}

@keyframes cortex-live-glimmer {
  0%, 100% { opacity: 0.18; filter: blur(18px) saturate(1.05); }
  45% { opacity: 0.36; filter: blur(12px) saturate(1.25); }
  72% { opacity: 0.24; filter: blur(22px) saturate(1.15); }
}

@keyframes cortex-device-jolt {
  0%, 100% { transform: translate3d(0,0,0) rotate(0deg); }
  22% { transform: translate3d(var(--cortex-shake-x, 3px), var(--cortex-shake-y, -2px), 0) rotate(var(--cortex-shake-rot, 0.7deg)); }
  48% { transform: translate3d(var(--cortex-shake-x-neg, -2.5px), var(--cortex-shake-y-pos, 1.5px), 0) rotate(var(--cortex-shake-rot-neg, -0.55deg)); }
  72% { transform: translate3d(1.4px, -0.8px, 0) rotate(var(--cortex-shake-rest, 0.35deg)); }
}

/* ═══════════════════════════════════════════
   GLASS UTILITIES
   ═══════════════════════════════════════════ */

.glass-base {
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
}

.glass-heavy {
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
}

.glass-dark {
  backdrop-filter: blur(30px) saturate(150%);
  -webkit-backdrop-filter: blur(30px) saturate(150%);
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
}

/* Shimmer border effect */
.glass-shimmer {
  position: relative;
  overflow: hidden;
}
.glass-shimmer::after {
  content: '';
  position: absolute;
  top: -1px; right: -1px; bottom: -1px; left: -1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  background-size: 200% 100%;
  animation: shimmer 3s ease-in-out infinite;
  border-radius: inherit;
  pointer-events: none;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  -webkit-mask-composite: xor;
  padding: 1px;
}

/* Shine sweep overlay */
.glass-shine {
  position: relative;
  overflow: hidden;
}
.glass-shine::before {
  content: '';
  position: absolute;
  top: 0; width: 40%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  animation: shine-sweep 4s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}

/* ═══════════════════════════════════════════
   SCROLL UTILITIES
   ═══════════════════════════════════════════ */

.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* ═══════════════════════════════════════════
   ANIMATION UTILITY CLASSES
   ═══════════════════════════════════════════ */

.anim-float { animation: float 4s ease-in-out infinite; }
.anim-float-slow { animation: float-slow 6s ease-in-out infinite; }
.anim-pulse { animation: pulse-glow 3s ease-in-out infinite; }
.anim-gradient { 
  background-size: 200% 200%;
  animation: gradient-shift 6s ease infinite; 
}
.anim-rotate { animation: rotate-slow 20s linear infinite; }

/* Stagger children animation */
.stagger-children > * {
  animation: stagger-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
.stagger-children > *:nth-child(1) { animation-delay: 0.05s; }
.stagger-children > *:nth-child(2) { animation-delay: 0.1s; }
.stagger-children > *:nth-child(3) { animation-delay: 0.15s; }
.stagger-children > *:nth-child(4) { animation-delay: 0.2s; }
.stagger-children > *:nth-child(5) { animation-delay: 0.25s; }
.stagger-children > *:nth-child(6) { animation-delay: 0.3s; }
.stagger-children > *:nth-child(7) { animation-delay: 0.35s; }
.stagger-children > *:nth-child(8) { animation-delay: 0.4s; }
.stagger-children > *:nth-child(9) { animation-delay: 0.45s; }
.stagger-children > *:nth-child(10) { animation-delay: 0.5s; }

/* Bounce easing */
.bounce-in {
  animation: scale-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

/* Smooth page transitions */
.page-enter {
  animation: slide-up 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

.page-exit {
  animation: slide-up 0.3s ease reverse backwards;
}

/* Batch 2/3 motion: Claude-like buttery, bubbly, jiggly layer */
.cortex-motion-page > * {
  animation: buttery-pop 0.72s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}
.cortex-motion-page > *:nth-child(1) { animation-delay: 0.03s; }
.cortex-motion-page > *:nth-child(2) { animation-delay: 0.08s; }
.cortex-motion-page > *:nth-child(3) { animation-delay: 0.13s; }
.cortex-motion-page > *:nth-child(4) { animation-delay: 0.18s; }
.cortex-motion-page > *:nth-child(5) { animation-delay: 0.23s; }
.cortex-motion-page > *:nth-child(6) { animation-delay: 0.28s; }
.cortex-motion-page > *:nth-child(7) { animation-delay: 0.33s; }
.cortex-motion-page > *:nth-child(8) { animation-delay: 0.38s; }
.cortex-motion-page > *:nth-child(9) { animation-delay: 0.43s; }
.cortex-motion-card {
  position: relative;
  transform-origin: center;
  animation: buttery-pop 0.72s cubic-bezier(0.16, 1, 0.3, 1) backwards,
             bubbly-breathe 7.5s ease-in-out 1s infinite;
}
.cortex-sensor-active .cortex-motion-card,
.cortex-sensor-active .b1-card,
.cortex-sensor-active .b1-button,
.cortex-sensor-active .cortex-motion-press,
.cortex-sensor-active .cortex-library-nav button,
.cortex-sensor-active .cortex-wallpaper-toggle button,
.cortex-sensor-active .cortex-motion-sensor-control,
.cortex-sensor-active .b1-toggle {
  transform-style: preserve-3d;
  will-change: transform;
}
.cortex-device-shake .cortex-library-stage-inner {
  animation: cortex-device-jolt 520ms cubic-bezier(0.34,1.56,0.64,1);
}
.cortex-device-shake .cortex-wallpaper-layer {
  filter: saturate(1.08) brightness(1.05);
}
.cortex-motion-card::after {
  content: '';
  position: absolute;
  inset: 0;
  width: 38%;
  border-radius: inherit;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
  animation: liquid-sheen 5.8s ease-in-out infinite;
  pointer-events: none;
}
.cortex-motion-press {
  transition: transform 0.34s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.34s ease, border-color 0.34s ease;
}
.cortex-motion-press:active {
  animation: jelly-press 0.45s cubic-bezier(0.34,1.56,0.64,1);
}
.cortex-motion-orb {
  animation: soft-wobble 5.6s ease-in-out infinite, float 4.2s ease-in-out infinite;
}
.cortex-motion-pill {
  animation: pill-jiggle 4.2s cubic-bezier(0.34,1.56,0.64,1) infinite;
}

@media (prefers-reduced-motion: reduce) {
  .cortex-motion-page > *,
  .cortex-motion-card,
  .cortex-motion-card::after,
  .cortex-motion-press:active,
  .cortex-motion-orb,
  .cortex-motion-pill {
    animation: none !important;
  }
}

/* Interactive wallpaper layer */
.cortex-wallpaper-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  background: #070718;
  --pointer-x: 50%;
  --pointer-y: 45%;
  --wallpaper-x: 0px;
  --wallpaper-y: 0px;
}
.cortex-sensor-active .cortex-wallpaper-layer {
  transform: translate3d(var(--cortex-wallpaper-shift-x, 0px), var(--cortex-wallpaper-shift-y, 0px), 0) scale(1.012);
  transition: transform 90ms linear, filter 220ms ease;
}
.cortex-wallpaper-layer[data-exhibition="false"] {
  opacity: 0.64;
}
.cortex-wallpaper-layer[data-exhibition="true"] {
  opacity: 1;
}
.cortex-wallpaper-image {
  position: absolute;
  inset: -6%;
  background-image: var(--wallpaper-image);
  background-size: cover;
  background-position: center;
  opacity: 0.72;
  transform-origin: center;
  animation: cortex-wallpaper-drift 18s ease-in-out infinite;
  will-change: transform, filter, opacity;
}
.cortex-wallpaper-layer[data-wallpaper="bubbly"] .cortex-wallpaper-image {
  opacity: 0.82;
  filter: saturate(1.12) contrast(1.02);
  mix-blend-mode: screen;
}
.cortex-wallpaper-layer[data-wallpaper="aurora"] .cortex-wallpaper-image {
  opacity: 0.76;
  filter: saturate(1.08) contrast(1.04);
}
.cortex-wallpaper-layer[data-wallpaper="organza"] .cortex-wallpaper-image {
  opacity: 0.78;
  filter: saturate(1.1) hue-rotate(-4deg) contrast(1.03);
}
.cortex-wallpaper-layer[data-mode="generative"] {
  background:
    radial-gradient(circle at 50% 35%, rgba(50,45,130,0.58), transparent 46%),
    linear-gradient(145deg, #050714 0%, #0a0820 48%, #050712 100%);
}
.cortex-wallpaper-layer[data-mode="generative"] .cortex-wallpaper-caustic {
  opacity: 0.34;
}
.cortex-wallpaper-layer[data-mode="generative"] .cortex-wallpaper-hotspot {
  opacity: 0.32;
}
.cortex-wallpaper-layer[data-exhibition="true"][data-mode="generative"] .cortex-wallpaper-caustic {
  opacity: 0.56;
}
.cortex-wallpaper-layer[data-exhibition="true"][data-mode="generative"] .cortex-wallpaper-hotspot {
  opacity: 0.50;
}
.cortex-wallpaper-minimal-field,
.cortex-wallpaper-organza-field {
  position: absolute;
  inset: -10%;
  background:
    radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255,255,255,0.16), transparent 18%),
    radial-gradient(circle at 15% 20%, rgba(104,120,255,0.20), transparent 28%),
    radial-gradient(circle at 82% 18%, rgba(71,226,255,0.13), transparent 28%),
    radial-gradient(circle at 52% 76%, rgba(190,92,255,0.15), transparent 32%);
  opacity: 0.78;
  filter: blur(4px);
  animation: cortex-wallpaper-drift 32s ease-in-out infinite;
}
.cortex-wallpaper-organza-field {
  background:
    radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255,255,255,0.12), transparent 16%),
    radial-gradient(circle at 26% 18%, rgba(155,118,255,0.18), transparent 30%),
    radial-gradient(circle at 70% 22%, rgba(62,211,255,0.12), transparent 28%),
    radial-gradient(circle at 58% 82%, rgba(218,130,255,0.15), transparent 34%);
}
.cortex-live-bubble {
  position: absolute;
  border-radius: 999px;
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,0.52), transparent 13%),
    radial-gradient(circle at 68% 72%, var(--bubble-color), transparent 56%),
    radial-gradient(circle, rgba(255,255,255,0.04), transparent 66%);
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow:
    inset 0 0 42px rgba(255,255,255,0.08),
    0 0 70px rgba(99,102,241,0.18);
  filter: blur(0.2px);
  mix-blend-mode: screen;
  animation: cortex-live-float-a var(--live-duration, 24s) ease-in-out infinite;
  will-change: transform, opacity;
}
.cortex-live-bubble::after {
  content: "";
  position: absolute;
  inset: 18%;
  border-radius: inherit;
  border: 1px solid rgba(255,255,255,0.16);
  opacity: 0.62;
}
.cortex-live-facet {
  position: absolute;
  border-radius: 46% 54% 62% 38% / 42% 52% 48% 58%;
  background:
    linear-gradient(120deg, rgba(255,255,255,0.10), transparent 35%, rgba(99,102,241,0.13), transparent 72%),
    radial-gradient(circle at 40% 30%, rgba(255,255,255,0.18), transparent 28%);
  border: 1px solid rgba(255,255,255,0.10);
  filter: blur(9px);
  opacity: 0.46;
  mix-blend-mode: screen;
  animation: cortex-live-float-b var(--live-duration, 30s) ease-in-out infinite;
}
.cortex-live-kaleidoscope-line {

// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).

  const [values, setValues] = React.useState(defaults);

  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null

    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}

  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function NeuralBackground() {
  const canvasRef = React.useRef(null);
  const theme = useTheme();
  React.useEffect(() => {
    const c = canvasRef.current; if (!c) return;
    const ctx = c.getContext('2d');
    let w = c.width = c.parentElement.offsetWidth;
    let h = c.height = c.parentElement.offsetHeight;
    const nodes = Array.from({length: 35}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4,
      r: Math.random()*3+1, pulse: Math.random()*Math.PI*2
    }));
    let raf;
    function draw(t) {
      ctx.clearRect(0,0,w,h);
      nodes.forEach(n => {
        n.x += n.vx; n.y += n.vy;
        if(n.x<0||n.x>w) n.vx*=-1;
        if(n.y<0||n.y>h) n.vy*=-1;
        n.pulse += 0.02;
      });
      nodes.forEach((a,i) => {
        nodes.forEach((b,j) => {
          if(i>=j) return;
          const d = Math.hypot(a.x-b.x, a.y-b.y);
          if(d<120) {
            const alpha = (1-d/120)*0.25;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(168,85,247,${alpha})`;
            ctx.lineWidth = 0.8; ctx.stroke();
          }
        });
        const glow = Math.sin(a.pulse)*0.4+0.6;
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r*glow*2, 0, Math.PI*2);
        ctx.fillStyle = `rgba(168,85,247,${glow*0.3})`;
        ctx.fill();
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(200,160,255,${glow*0.8})`;
        ctx.fill();
      });
      raf = requestAnimationFrame(draw);
    }
    draw(0);
    return () => cancelAnimationFrame(raf);
  }, []);
  return React.createElement('canvas', {
    ref: canvasRef,
    style: { position:'absolute', inset:0, width:'100%', height:'100%', opacity:0.6 }
  });
}

function MatrixBackground() {
  const canvasRef = React.useRef(null);
  React.useEffect(() => {
    const c = canvasRef.current; if(!c) return;
    const ctx = c.getContext('2d');
    let w = c.width = c.parentElement.offsetWidth;
    let h = c.height = c.parentElement.offsetHeight;
    const cols = Math.floor(w/14);

function B1Ripple({ children, style }) {
  const ref = React.useRef(null);

/* cortex-motion-sensors.jsx */
/* CORTEX - PWA motion sensor layer
   Subtle gyro tilt and shake impulse for browser/PWA contexts. */

function cortexClampMotion(value, min, max) {
  return Math.max(min, Math.min(max, value || 0));
}

function cortexSetMotionVars(x, y, force) {
  const root = document.documentElement;
  root.style.setProperty('--cortex-tilt-x', x.toFixed(3));
  root.style.setProperty('--cortex-tilt-y', y.toFixed(3));
  root.style.setProperty('--cortex-depth-x', `${(x * 12).toFixed(2)}px`);
  root.style.setProperty('--cortex-depth-y', `${(y * 9).toFixed(2)}px`);
  root.style.setProperty('--cortex-wallpaper-shift-x', `${(x * -5.8).toFixed(2)}px`);
  root.style.setProperty('--cortex-wallpaper-shift-y', `${(y * -3.7).toFixed(2)}px`);
  root.style.setProperty('--cortex-card-tilt-x', `${(x * 1.55).toFixed(3)}deg`);
  root.style.setProperty('--cortex-card-tilt-y', `${(y * -1.35).toFixed(3)}deg`);
  root.style.setProperty('--cortex-card-shift-x', `${(x * 0.6).toFixed(3)}px`);
  root.style.setProperty('--cortex-card-shift-y', `${(y * 0.48).toFixed(3)}px`);
  root.style.setProperty('--cortex-button-tilt-x', `${(x * 1.18).toFixed(3)}deg`);
  root.style.setProperty('--cortex-button-tilt-y', `${(y * -1.02).toFixed(3)}deg`);
  root.style.setProperty('--cortex-button-shift-x', `${(x * 0.38).toFixed(3)}px`);
  root.style.setProperty('--cortex-button-shift-y', `${(y * 0.3).toFixed(3)}px`);
  root.style.setProperty('--cortex-control-tilt-x', `${(x * 1.02).toFixed(3)}deg`);
  root.style.setProperty('--cortex-control-tilt-y', `${(y * -0.92).toFixed(3)}deg`);
  root.style.setProperty('--cortex-control-shift-x', `${(x * 0.3).toFixed(3)}px`);
  root.style.setProperty('--cortex-control-shift-y', `${(y * 0.24).toFixed(3)}px`);
  root.style.setProperty('--cortex-shake-force', (force || 0).toFixed(3));
}

function CortexMotionSensorControl() {
  const supported = typeof window !== 'undefined' &&
    ('DeviceOrientationEvent' in window || 'DeviceMotionEvent' in window);
  const needsGesture = typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function';
  const [status, setStatus] = React.useState(supported ? 'idle' : 'unsupported');
  const motionRef = React.useRef({
    active:false,
    x:0,
    y:0,
    lastForce:0,
    lastShake:0,
    frame:null,
  });

  React.useEffect(() => {
    document.documentElement.dataset.motionSensor = status;
    document.documentElement.classList.toggle('cortex-sensor-active', status === 'active');
    document.documentElement.classList.toggle('cortex-sensor-unsupported', status === 'unsupported');
    return () => {
      document.documentElement.classList.remove('cortex-sensor-active', 'cortex-sensor-unsupported');
      document.documentElement.removeAttribute('data-motion-sensor');
    };
  }, [status]);

  React.useEffect(() => {
    return () => {
      if (motionRef.current.frame) cancelAnimationFrame(motionRef.current.frame);
      cortexSetMotionVars(0, 0, 0);
    };
  }, []);

  const attach = React.useCallback(() => {
    if (motionRef.current.active) return;
    motionRef.current.active = true;
    setStatus('active');

    const write = (nextX, nextY, force) => {
      if (motionRef.current.frame) cancelAnimationFrame(motionRef.current.frame);
      motionRef.current.frame = requestAnimationFrame(() => {
        motionRef.current.x = motionRef.current.x * 0.86 + nextX * 0.14;
        motionRef.current.y = motionRef.current.y * 0.86 + nextY * 0.14;
        cortexSetMotionVars(motionRef.current.x, motionRef.current.y, force || 0);
      });
    };

    const onOrientation = event => {
      const gamma = cortexClampMotion(event.gamma || 0, -32, 32);
      const beta = cortexClampMotion((event.beta || 0) - 20, -38, 38);
      const x = cortexClampMotion(gamma / 32, -1, 1);
      const y = cortexClampMotion(beta / 38, -1, 1);
      write(x, y, 0);
    };

    const onMotion = event => {
      const a = event.accelerationIncludingGravity || event.acceleration;
      if (!a) return;
      const force = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
      const delta = Math.abs(force - motionRef.current.lastForce);
      motionRef.current.lastForce = force;
      const now = performance.now();
      if (delta > 7.5 && now - motionRef.current.lastShake > 540) {
        motionRef.current.lastShake = now;
        const jolt = Math.min(delta / 15, 1);
        document.documentElement.style.setProperty('--cortex-shake-force', jolt.toFixed(3));
        document.documentElement.style.setProperty('--cortex-shake-x', `${(jolt * 4.2).toFixed(2)}px`);
        document.documentElement.style.setProperty('--cortex-shake-y', `${(jolt * -3.1).toFixed(2)}px`);
        document.documentElement.style.setProperty('--cortex-shake-x-neg', `${(jolt * -3.6).toFixed(2)}px`);
        document.documentElement.style.setProperty('--cortex-shake-y-pos', `${(jolt * 2.2).toFixed(2)}px`);
        document.documentElement.style.setProperty('--cortex-shake-rot', `${(jolt * 1.05).toFixed(3)}deg`);
        document.documentElement.style.setProperty('--cortex-shake-rot-neg', `${(jolt * -0.82).toFixed(3)}deg`);
        document.documentElement.style.setProperty('--cortex-shake-rest', `${(jolt * 0.3).toFixed(3)}deg`);
        document.documentElement.classList.add('cortex-device-shake');
        window.setTimeout(() => document.documentElement.classList.remove('cortex-device-shake'), 620);
      }
    };

    window.addEventListener('deviceorientation', onOrientation, { passive:true });
    window.addEventListener('devicemotion', onMotion, { passive:true });

    motionRef.current.detach = () => {
      window.removeEventListener('deviceorientation', onOrientation);
      window.removeEventListener('devicemotion', onMotion);
      motionRef.current.active = false;
      cortexSetMotionVars(0, 0, 0);
    };
  }, []);

  const enable = React.useCallback(async () => {
    if (!supported) {
      setStatus('unsupported');
      return;
    }
    try {
      const requests = [];
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        requests.push(DeviceOrientationEvent.requestPermission());
      }
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        requests.push(DeviceMotionEvent.requestPermission());
      }
      const results = await Promise.all(requests);
      if (results.some(result => result !== 'granted')) {
        setStatus('denied');
        return;
      }
      attach();
    } catch (error) {
      setStatus('denied');
    }
  }, [attach, supported]);

  const disable = React.useCallback(() => {
    if (motionRef.current.detach) motionRef.current.detach();
    setStatus(supported ? 'idle' : 'unsupported');
  }, [supported]);

  const label = status === 'active' ? 'Gyro on'
    : status === 'denied' ? 'Gyro off'
    : status === 'unsupported' ? 'No gyro'
    : needsGesture ? 'Enable gyro' : 'Gyro';
  const color = status === 'active' ? DL.teal
    : status === 'denied' ? DL.gold
    : status === 'unsupported' ? DL.mute
    : DL.accent;

  return React.createElement('button', {
    type:'button',
    className:'cortex-motion-sensor-control cortex-motion-press',
    onClick:status === 'active' ? disable : enable,
    title:status === 'active'
      ? 'Motion sensor is active'
      : 'Enable subtle gyro tilt and shake response',
    'data-status':status,
    style:{ '--sensor-color':color },
  },
    React.createElement('span', { className:'sensor-dot' }),
    React.createElement('span', { className:'sensor-label-full' }, label),
    React.createElement('span', { className:'sensor-label-short' }, 'Gyro')
  );
}

        React.createElement('div', { style:{ display:'flex', gap:8, alignItems:'center' }},
          React.createElement(CortexMotionSensorControl),

          React.createElement(B1Badge, { color:mode === 'desktop' ? DL.teal : mode === 'tablet' ? DL.gold : DL.accent }, mode.toUpperCase()),
          React.createElement(B1Badge, null, '0-24'),

      React.createElement('section', {

        React.createElement('div', { className:'cortex-library-stage', style:{
          height:'100%', width:'100%',
          maxWidth:mode === 'desktop' ? 'none' : '100%',

          borderRadius:mode === 'mobile' ? 0 : 28,
          border:mode === 'mobile' ? 'none' : `1px solid ${DL.glassBorder}`,
          background:isWelcomePage ? 'rgba(10,10,26,0.38)' : 'rgba(10,10,26,0.58)',
          boxShadow:mode === 'mobile' ? 'none' : `0 18px 60px ${DL.shadowColor}, inset 0 1px 0 ${DL.glassHigh}`,
          backdropFilter:isWelcomePage ? 'blur(14px) saturate(165%)' : 'blur(24px) saturate(180%)',
          WebkitBackdropFilter:isWelcomePage ? 'blur(14px) saturate(165%)' : 'blur(24px) saturate(180%)',
        }},
          React.createElement('div', { className:'cortex-library-stage-inner', style:{ height:'100%', overflow:'hidden', position:'relative' }}, renderPage())
        )
      )
    )
  );
}

Object.assign(window, { CORTEX_LIBRARY_PAGES, PageBatch0Kernel, CortexLibraryShell });
