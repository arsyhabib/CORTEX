  <meta charset="UTF-8">

/* CORTEX EDUCATION — Master Stylesheet */
/* Glass Effects, Animations, Backgrounds */

* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --cortex-tilt-x: 0;
  --cortex-tilt-y: 0;
  --cortex-depth-x: 0px;
  --cortex-depth-y: 0px;
  --cortex-wallpaper-shift-x: 0px;
  --cortex-wallpaper-shift-y: 0px;
  --cortex-card-tilt-x: 0deg;
  --cortex-card-tilt-y: 0deg;
  --cortex-card-shift-x: 0px;
  --cortex-card-shift-y: 0px;
  --cortex-button-tilt-x: 0deg;
  --cortex-button-tilt-y: 0deg;
  --cortex-button-shift-x: 0px;
  --cortex-button-shift-y: 0px;
  --cortex-motion-scale: 1;
  --cortex-shake-scale: 1;
  --cortex-shake-force: 0;
  --cortex-shake-x: 0px;
  --cortex-shake-y: 0px;
  --cortex-shake-x-neg: 0px;
  --cortex-shake-y-pos: 0px;
  --cortex-shake-rot: 0deg;
  --cortex-shake-rot-neg: 0deg;
  --cortex-shake-rest: 0deg;
  --cortex-touch-shift-x: 0px;
  --cortex-touch-shift-y: 0px;
  --cortex-touch-sheen-x: 0px;
  --cortex-touch-sheen-y: 0px;
  --cortex-touch-sheen-angle: 0deg;
  --cortex-touch-squash: 0;
  --cortex-touch-scale: 0;
  --cortex-touch-press: 0;
  --cortex-text-zoom: 1;
}

/* ═══════════════════════════════════════════
   KEYFRAME ANIMATIONS
   ═══════════════════════════════════════════ */

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}

@keyframes float-slow {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  33% { transform: translateY(-12px) rotate(1deg); }
  66% { transform: translateY(-6px) rotate(-1deg); }
}

@keyframes pulse-glow {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.05); }
}

@keyframes slide-up {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes slide-down {
  0% { opacity: 0; transform: translateY(-20px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes scale-in {
  0% { opacity: 0; transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes scale-bounce {
  0% { opacity: 0; transform: scale(0.5); }
  60% { transform: scale(1.08); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes gradient-shift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes rotate-slow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes border-dance {
  0% { border-color: rgba(255,255,255,0.15); }
  50% { border-color: rgba(255,255,255,0.35); }
  100% { border-color: rgba(255,255,255,0.15); }
}

@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(var(--glow-rgb), 0.2); }
  50% { box-shadow: 0 0 40px rgba(var(--glow-rgb), 0.5); }
}

@keyframes text-glow {
  0%, 100% { text-shadow: 0 0 10px currentColor; }
  50% { text-shadow: 0 0 25px currentColor, 0 0 40px currentColor; }
}

@keyframes morph-blob {
  0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
  25% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
  50% { border-radius: 50% 60% 30% 60% / 40% 70% 60% 30%; }
  75% { border-radius: 60% 30% 60% 40% / 70% 40% 50% 60%; }
}

@keyframes mosaic-tile {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

@keyframes stagger-in {
  0% { opacity: 0; transform: translateY(20px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes ripple {
  0% { transform: scale(0); opacity: 0.5; }
  100% { transform: scale(4); opacity: 0; }
}

@keyframes typewriter {
  from { width: 0; }
  to { width: 100%; }
}

@keyframes blink-cursor {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

@keyframes scanline {
  0% { top: -10%; }
  100% { top: 110%; }
}

@keyframes particle-rise {
  0% { transform: translateY(100%) scale(0); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 0.6; }
  100% { transform: translateY(-100vh) scale(1); opacity: 0; }
}

@keyframes wave-flow {
  0% { transform: translateX(0) translateY(0); }
  50% { transform: translateX(-25%) translateY(-5%); }
  100% { transform: translateX(0) translateY(0); }
}

@keyframes iris-open {
  0% { clip-path: circle(0% at 50% 50%); opacity: 0; }
  100% { clip-path: circle(75% at 50% 50%); opacity: 1; }
}

@keyframes slide-right {
  0% { opacity: 0; transform: translateX(-30px); }
  100% { opacity: 1; transform: translateX(0); }
}

@keyframes counter-up {
  0% { opacity: 0; transform: translateY(15px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes shine-sweep {
  0% { left: -100%; }
  100% { left: 200%; }
}

@keyframes gold-shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}

@keyframes buttery-pop {
  0% { opacity: 0; transform: translateY(24px) scale(0.92); filter: blur(8px); }
  55% { opacity: 1; transform: translateY(-4px) scale(1.025); filter: blur(0); }
  78% { transform: translateY(2px) scale(0.992); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes bubbly-breathe {
  0%, 100% { transform: translateY(0) scale(1); border-radius: 20px; }
  35% { transform: translateY(-3px) scale(1.006); border-radius: 24px; }
  70% { transform: translateY(1px) scale(0.998); border-radius: 18px; }
}

@keyframes jelly-press {
  0% { transform: scale(1); }
  32% { transform: scale(0.965, 1.035); }
  62% { transform: scale(1.018, 0.982); }
  100% { transform: scale(1); }
}
@keyframes cortex-button-tap-bloom {
  0% { opacity: 0.0; transform: scale(0.94); filter: blur(1px); }
  32% { opacity: 1; transform: scale(1.02); filter: blur(0); }
  64% { transform: scale(0.985); }
  100% { opacity: 1; transform: scale(1); filter: blur(0); }
}

@keyframes soft-wobble {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  25% { transform: rotate(-0.8deg) translateY(-2px); }
  55% { transform: rotate(0.7deg) translateY(1px); }
  80% { transform: rotate(-0.3deg) translateY(-1px); }
}

@keyframes cortex-water-ripple-ambient {
  0%, 100% { opacity: 0.14; transform: scale(0.985) rotate(0deg); }
  35% { opacity: 0.22; transform: scale(1.01) rotate(0.2deg); }
  70% { opacity: 0.16; transform: scale(1.024) rotate(-0.18deg); }
}

@keyframes liquid-sheen {
  0% { transform: translateX(-120%) skewX(-18deg); opacity: 0; }
  18% { opacity: 0.65; }
  46% { opacity: 0; }
  100% { transform: translateX(220%) skewX(-18deg); opacity: 0; }
}

@keyframes pill-jiggle {
  0% { transform: scale(1) rotate(0deg); }
  35% { transform: scale(1.08, 0.94) rotate(-1.2deg); }
  65% { transform: scale(0.98, 1.04) rotate(0.8deg); }
  100% { transform: scale(1) rotate(0deg); }
}

@keyframes cortex-touch-flop {
  0% { transform: translate3d(0, 0, 0) scale3d(1, 1, 1); }
  30% { transform: translate3d(1px, -1px, 0) scale3d(1.03, 0.97, 1); }
  58% { transform: translate3d(-1px, 1px, 0) scale3d(0.985, 1.025, 1); }
  82% { transform: translate3d(0.5px, -0.5px, 0) scale3d(1.008, 0.995, 1); }
  100% { transform: translate3d(0, 0, 0) scale3d(1, 1, 1); }
}

@keyframes cortex-wallpaper-drift {
  0%, 100% { transform: translate3d(var(--wallpaper-x, 0px), var(--wallpaper-y, 0px), 0) scale(1.07) rotate(0deg); }
  45% { transform: translate3d(calc(var(--wallpaper-x, 0px) * 1.4 + 10px), calc(var(--wallpaper-y, 0px) * 1.2 - 12px), 0) scale(1.105) rotate(0.7deg); }
  72% { transform: translate3d(calc(var(--wallpaper-x, 0px) * 0.7 - 7px), calc(var(--wallpaper-y, 0px) * 1.5 + 8px), 0) scale(1.085) rotate(-0.45deg); }
}

@keyframes cortex-wallpaper-bloom {
  0%, 100% { opacity: 0.36; transform: translate(-50%, -50%) scale(0.82); filter: blur(22px); }
  50% { opacity: 0.62; transform: translate(-50%, -50%) scale(1.14); filter: blur(16px); }
}

@keyframes cortex-ripple-pop {
  0% { opacity: 0.46; transform: translate(-50%, -50%) scale(0.12); }
  65% { opacity: 0.22; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(2.8); }
}

@keyframes cortex-live-float-a {
  0%, 100% { transform: translate3d(var(--wallpaper-x,0px), var(--wallpaper-y,0px), 0) scale(0.96) rotate(0deg); }
  33% { transform: translate3d(calc(var(--wallpaper-x,0px) * -0.7 + 22px), calc(var(--wallpaper-y,0px) * 0.8 - 18px), 0) scale(1.04) rotate(7deg); }
  66% { transform: translate3d(calc(var(--wallpaper-x,0px) * 0.9 - 18px), calc(var(--wallpaper-y,0px) * -0.6 + 20px), 0) scale(1.01) rotate(-5deg); }
}

@keyframes cortex-live-float-b {
  0%, 100% { transform: translate3d(0,0,0) rotate(var(--facet-rotate,0deg)) scale(1); }
  45% { transform: translate3d(28px,-18px,0) rotate(calc(var(--facet-rotate,0deg) + 10deg)) scale(1.05); }
  72% { transform: translate3d(-18px,16px,0) rotate(calc(var(--facet-rotate,0deg) - 6deg)) scale(0.98); }
}

@keyframes cortex-live-ribbon-drift {
  0%, 100% { transform: translate3d(calc(var(--wallpaper-x,0px) * 0.35), calc(var(--wallpaper-y,0px) * 0.22), 0) rotate(var(--ribbon-rotate,0deg)) scale(1); }
  38% { transform: translate3d(calc(var(--wallpaper-x,0px) * -0.42 + 18px), calc(var(--wallpaper-y,0px) * 0.40 - 20px), 0) rotate(calc(var(--ribbon-rotate,0deg) + 5deg)) scale(1.04); }
  70% { transform: translate3d(calc(var(--wallpaper-x,0px) * 0.20 - 22px), calc(var(--wallpaper-y,0px) * -0.36 + 16px), 0) rotate(calc(var(--ribbon-rotate,0deg) - 4deg)) scale(0.99); }
}

@keyframes cortex-live-glimmer {
  0%, 100% { opacity: 0.18; filter: blur(18px) saturate(1.05); }
  45% { opacity: 0.36; filter: blur(12px) saturate(1.25); }
  72% { opacity: 0.24; filter: blur(22px) saturate(1.15); }
}

@keyframes cortex-device-jolt {
  0%, 100% { transform: translate3d(0,0,0) rotate(0deg); }
  14% { transform: translate3d(calc(var(--cortex-shake-x, 3px) * 0.65), calc(var(--cortex-shake-y, -2px) * 0.55), 0) rotate(calc(var(--cortex-shake-rot, 0.7deg) * 0.6)); }
  30% { transform: translate3d(var(--cortex-shake-x, 3px), var(--cortex-shake-y, -2px), 0) rotate(var(--cortex-shake-rot, 0.7deg)); }
  48% { transform: translate3d(var(--cortex-shake-x-neg, -2.5px), var(--cortex-shake-y-pos, 1.5px), 0) rotate(var(--cortex-shake-rot-neg, -0.55deg)); }
  66% { transform: translate3d(calc(var(--cortex-shake-x-neg, -2.5px) * 0.45), calc(var(--cortex-shake-y-pos, 1.5px) * 0.55), 0) rotate(calc(var(--cortex-shake-rot-neg, -0.55deg) * 0.45)); }
  82% { transform: translate3d(1px, -0.6px, 0) rotate(var(--cortex-shake-rest, 0.35deg)); }
}

/* ═══════════════════════════════════════════
   GLASS UTILITIES
   ═══════════════════════════════════════════ */

.glass-base {
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
}

.glass-heavy {
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
}

.glass-dark {
  backdrop-filter: blur(30px) saturate(150%);
  -webkit-backdrop-filter: blur(30px) saturate(150%);
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
}

/* Shimmer border effect */
.glass-shimmer {
  position: relative;
  overflow: hidden;
}
.glass-shimmer::after {
  content: '';
  position: absolute;
  top: -1px; right: -1px; bottom: -1px; left: -1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  background-size: 200% 100%;
  animation: shimmer 3s ease-in-out infinite;
  border-radius: inherit;
  pointer-events: none;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  -webkit-mask-composite: xor;
  padding: 1px;
}

/* Shine sweep overlay */
.glass-shine {
  position: relative;
  overflow: hidden;
}
.glass-shine::before {
  content: '';
  position: absolute;
  top: 0; width: 40%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  animation: shine-sweep 4s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}

/* ═══════════════════════════════════════════
   SCROLL UTILITIES
   ═══════════════════════════════════════════ */

.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* ═══════════════════════════════════════════
   ANIMATION UTILITY CLASSES
   ═══════════════════════════════════════════ */

.anim-float { animation: float 4s ease-in-out infinite; }
.anim-float-slow { animation: float-slow 6s ease-in-out infinite; }
.anim-pulse { animation: pulse-glow 3s ease-in-out infinite; }
.anim-gradient { 
  background-size: 200% 200%;
  animation: gradient-shift 6s ease infinite; 
}
.anim-rotate { animation: rotate-slow 20s linear infinite; }

/* Stagger children animation */
.stagger-children > * {
  animation: stagger-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
.stagger-children > *:nth-child(1) { animation-delay: 0.05s; }
.stagger-children > *:nth-child(2) { animation-delay: 0.1s; }
.stagger-children > *:nth-child(3) { animation-delay: 0.15s; }
.stagger-children > *:nth-child(4) { animation-delay: 0.2s; }
.stagger-children > *:nth-child(5) { animation-delay: 0.25s; }
.stagger-children > *:nth-child(6) { animation-delay: 0.3s; }
.stagger-children > *:nth-child(7) { animation-delay: 0.35s; }
.stagger-children > *:nth-child(8) { animation-delay: 0.4s; }
.stagger-children > *:nth-child(9) { animation-delay: 0.45s; }
.stagger-children > *:nth-child(10) { animation-delay: 0.5s; }

/* Bounce easing */
.bounce-in {
  animation: scale-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

/* Smooth page transitions */
.page-enter {
  animation: slide-up 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

.page-exit {
  animation: slide-up 0.3s ease reverse backwards;
}

@keyframes cortex-page-enter-forward {
  0% { opacity: 0; transform: translate3d(24px, 0, 0) scale(0.985); filter: blur(2px); }
  62% { opacity: 1; transform: translate3d(-2px, 0, 0) scale(1.004); filter: blur(0); }
  100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
}

@keyframes cortex-page-enter-back {
  0% { opacity: 0; transform: translate3d(-22px, 0, 0) scale(0.985); filter: blur(2px); }
  64% { opacity: 1; transform: translate3d(2px, 0, 0) scale(1.004); filter: blur(0); }
  100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
}

.cortex-library-content.cortex-page-enter-forward,
.cortex-library-content.cortex-page-enter-back {
  will-change: transform, opacity, filter;
}

.cortex-library-content.cortex-page-enter-forward {
  animation: cortex-page-enter-forward 0.56s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}

.cortex-library-content.cortex-page-enter-back {
  animation: cortex-page-enter-back 0.64s cubic-bezier(0.12, 0.9, 0.2, 1) backwards;
}

/* Batch 2/3 motion: Claude-like buttery, bubbly, jiggly layer */
.cortex-motion-page > * {
  animation: buttery-pop 0.72s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}
.cortex-motion-page > *:nth-child(1) { animation-delay: 0.03s; }
.cortex-motion-page > *:nth-child(2) { animation-delay: 0.08s; }
.cortex-motion-page > *:nth-child(3) { animation-delay: 0.13s; }
.cortex-motion-page > *:nth-child(4) { animation-delay: 0.18s; }
.cortex-motion-page > *:nth-child(5) { animation-delay: 0.23s; }
.cortex-motion-page > *:nth-child(6) { animation-delay: 0.28s; }
.cortex-motion-page > *:nth-child(7) { animation-delay: 0.33s; }
.cortex-motion-page > *:nth-child(8) { animation-delay: 0.38s; }
.cortex-motion-page > *:nth-child(9) { animation-delay: 0.43s; }
.cortex-motion-card {
  position: relative;
  transform-origin: center;
  animation: buttery-pop 0.82s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}
.cortex-sensor-active .cortex-motion-card,
.cortex-sensor-active .b1-card,
.cortex-sensor-active .b1-button,
.cortex-sensor-active .cortex-motion-press,
.cortex-sensor-active .cortex-library-nav button,
.cortex-sensor-active .cortex-wallpaper-toggle button,
.cortex-sensor-active .cortex-motion-sensor-control,
.cortex-sensor-active .b1-toggle {
  transform-style: preserve-3d;
  will-change: transform;
}
.cortex-touch-active .cortex-motion-card,
.cortex-touch-active .b1-card,
.cortex-touch-active .b1-button,
.cortex-touch-active .cortex-motion-press,
.cortex-touch-active .cortex-library-nav button,
.cortex-touch-active .cortex-wallpaper-toggle button,
.cortex-touch-active .cortex-motion-sensor-control,
.cortex-touch-active .b1-toggle,
.cortex-touch-active .b1-search-input {
  animation: cortex-touch-flop 920ms cubic-bezier(0.18,1.08,0.3,1);
}
.cortex-device-shake .cortex-library-stage-inner {
  animation: cortex-device-jolt 820ms cubic-bezier(0.18,1.08,0.3,1);
}
.cortex-device-shake .cortex-wallpaper-layer {
  filter: saturate(1.08) brightness(1.05);
}
.cortex-motion-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    radial-gradient(circle at 24% 30%, rgba(255,255,255,0.12), transparent 18%),
    radial-gradient(circle at 70% 66%, rgba(168,85,247,0.10), transparent 16%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), transparent 68%);
  opacity: 0.12;
  animation: cortex-water-ripple-ambient 8.2s ease-in-out infinite;
  pointer-events: none;
}
.b1-card,
.b1-button,
.b1-toggle,
.b1-search-input,
.cortex-motion-sensor-control,
.cortex-library-nav button,
.cortex-wallpaper-toggle button {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  transform-origin: center;
}
.b1-card::before,
.b1-button::before,
.b1-toggle::before,
.b1-search-input::before,
.cortex-motion-sensor-control::before,
.cortex-library-nav button::before,
.cortex-wallpaper-toggle button::before {
  content: '';
  position: absolute;
  inset: -18%;
  border-radius: inherit;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12), rgba(255,255,255,0.04) 28%, transparent 66%),
    radial-gradient(circle at 50% 50%, rgba(168,85,247,0.08), transparent 72%);
  opacity: calc(0.03 + var(--cortex-touch-press, 0) * 0.06);
  mix-blend-mode: soft-light;
  transform: translate3d(var(--cortex-touch-sheen-x, 0px), var(--cortex-touch-sheen-y, 0px), 0) rotate(var(--cortex-touch-sheen-angle, 0deg));
  pointer-events: none;
  transition: opacity 220ms ease, transform 220ms cubic-bezier(0.16,1.1,0.28,1);
}
.cortex-ripple-ink {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  mix-blend-mode: normal;
  contain: paint;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.20), transparent 18%),
    radial-gradient(circle at 50% 50%, transparent 36%, rgba(255,255,255,0.22) 38%, transparent 41%),
    radial-gradient(circle at 50% 50%, transparent 58%, rgba(168,85,247,0.12) 60%, transparent 63%),
  radial-gradient(circle at 50% 50%, rgba(73,198,255,0.08), rgba(255,255,255,0.05) 32%, transparent 72%);

/* Interactive wallpaper layer */
.cortex-wallpaper-layer {
  position: absolute;
  inset: 0;

  pointer-events: none;
  background: #070718;
}
.cortex-wallpaper-layer[data-exhibition="false"] {
  opacity: 0.64;
}
.cortex-wallpaper-layer[data-exhibition="true"] {
  opacity: 1;
}
.cortex-wallpaper-performance-field {
  position: absolute;
  inset: -12%;
  opacity: 0.98;
  transform: translate3d(0,0,0);
  animation: cortex-performance-drift 32s ease-in-out infinite;
  will-change: transform, opacity;
}
.cortex-wallpaper-performance-field::before,
.cortex-wallpaper-performance-field::after {
  content: '';
  position: absolute;
  inset: 0;
  background-repeat: no-repeat;
  will-change: transform, opacity;
}
.cortex-wallpaper-performance-field::before {

    radial-gradient(circle at 18% 22%, rgba(120, 100, 255, 0.36), transparent 24%),
    radial-gradient(circle at 74% 18%, rgba(70, 220, 255, 0.22), transparent 20%),

  animation: cortex-performance-drift-a 34s ease-in-out infinite;
}
.cortex-wallpaper-performance-field::after {
  background:
    radial-gradient(circle at 34% 24%, rgba(255,255,255,0.08), transparent 18%),

  opacity: 0.72;
  animation: cortex-performance-drift-b 42s ease-in-out infinite reverse;
}
.cortex-wallpaper-layer[data-wallpaper="aurora"] .cortex-wallpaper-performance-field::before {
  background:
    radial-gradient(circle at 16% 24%, rgba(48, 211, 255, 0.30), transparent 24%),
    radial-gradient(circle at 74% 20%, rgba(166, 92, 255, 0.24), transparent 20%),

    linear-gradient(145deg, rgba(8, 10, 24, 0.98), rgba(5, 7, 18, 1));

.cortex-wallpaper-layer[data-wallpaper="bubbly"] .cortex-wallpaper-performance-field::before {

    radial-gradient(circle at 16% 22%, rgba(120, 100, 255, 0.34), transparent 22%),
    radial-gradient(circle at 76% 18%, rgba(52, 211, 255, 0.24), transparent 20%),
    radial-gradient(circle at 54% 74%, rgba(72, 255, 196, 0.12), transparent 28%),
    linear-gradient(145deg, rgba(10, 10, 30, 0.98), rgba(5, 7, 18, 1));

    radial-gradient(circle at 18% 24%, rgba(203, 108, 255, 0.26), transparent 22%),

.cortex-wallpaper-layer[data-exhibition="true"] .cortex-wallpaper-performance-field::after { opacity: 0.82; }
.cortex-wallpaper-layer[data-exhibition="false"] .cortex-wallpaper-performance-field {

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,

    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (

      display: 'flex', alignItems: 'center', minHeight: 52,

          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}

        <div style={{
          position: 'absolute', bottom: 0, right: 0,

}

function IOSList({ header, children, dark = false }) {

function IOSDevice({

    <div key={k} style={{

      background: ret ? '#08f' : keyBg,

      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',

        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function NeuralBackground() {
  const canvasRef = React.useRef(null);

    const ctx = c.getContext('2d');
    let w = c.width = c.parentElement.offsetWidth;
    let h = c.height = c.parentElement.offsetHeight;
    const nodes = Array.from({length: 35}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4,
      r: Math.random()*3+1, pulse: Math.random()*Math.PI*2

    let raf;
    function draw(t) {
      ctx.clearRect(0,0,w,h);
      nodes.forEach(n => {
        n.x += n.vx; n.y += n.vy;
        if(n.x<0||n.x>w) n.vx*=-1;
        if(n.y<0||n.y>h) n.vy*=-1;
        n.pulse += 0.02;
      });
      nodes.forEach((a,i) => {
        nodes.forEach((b,j) => {
          if(i>=j) return;
          const d = Math.hypot(a.x-b.x, a.y-b.y);
          if(d<120) {
            const alpha = (1-d/120)*0.25;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(168,85,247,${alpha})`;
            ctx.lineWidth = 0.8; ctx.stroke();

        ctx.beginPath(); ctx.arc(a.x, a.y, a.r*glow*2, 0, Math.PI*2);
        ctx.fillStyle = `rgba(168,85,247,${glow*0.3})`;
        ctx.fill();
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(200,160,255,${glow*0.8})`;
        ctx.fill();
      });

    }
    draw(0);
    return () => cancelAnimationFrame(raf);
  }, []);

    ref: canvasRef,
    style: { position:'absolute', inset:0, width:'100%', height:'100%', opacity:0.6 }

/* ── Animated Counter ── */
function B1Counter({ end, duration = 1200, suffix = '' }) {
  const [v, setV] = React.useState(0);
  React.useEffect(() => {
    const s = Date.now();
    const tick = () => {
      const p = Math.min(1, (Date.now()-s)/duration);
      setV(Math.round((1-Math.pow(1-p,3))*end));
      if(p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, [end]);
  return React.createElement('span', null, `${v.toLocaleString()}${suffix}`);
}

/* ── Ripple effect on tap ── */
function B1Ripple({ children, style }) {
  const ref = React.useRef(null);
  const handleClick = (e) => {
    const el = ref.current; if(!el) return;
    const rect = el.getBoundingClientRect();
    const r = document.createElement('span');
    const d = Math.max(rect.width, rect.height);
    r.style.cssText = `position:absolute;width:${d}px;height:${d}px;border-radius:50%;
      background:rgba(168,85,247,0.2);left:${e.clientX-rect.left-d/2}px;
      top:${e.clientY-rect.top-d/2}px;animation:ripple 0.6s ease-out;pointer-events:none;`;
    el.appendChild(r);
    setTimeout(()=>r.remove(),600);
  };
  return React.createElement('div', {
    ref, onClick: handleClick,
    style: { position:'relative', overflow:'hidden', ...style }
  }, children);
}

/* ── Global ripple tap feedback ── */
(function cortexInstallRippleFeedback() {
  if (window.__cortexRippleFeedbackInstalled) return;
  window.__cortexRippleFeedbackInstalled = true;
  const lastRippleAt = new WeakMap();
  const selector = [
    ".b1-card",
    ".b1-button",
    ".b1-toggle",
    ".b1-search-input",
    ".cortex-motion-sensor-control",
    ".cortex-library-nav button",
    ".cortex-wallpaper-toggle button",
  ].join(",");

  const spawnRipple = (target, event) => {
    if (!target || !target.getBoundingClientRect) return;
    const rect = target.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (coarse) return;
    const now = performance.now();
    const lastAt = lastRippleAt.get(target) || 0;
    if (now - lastAt < 180) return;
    lastRippleAt.set(target, now);
    const ink = document.createElement('span');
    const size = Math.max(rect.width, rect.height) * 1.16;
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    ink.className = 'cortex-ripple-ink';
    ink.style.width = size + 'px';
    ink.style.height = size + 'px';
    ink.style.left = x + 'px';
    ink.style.top = y + 'px';
    target.appendChild(ink);
    window.setTimeout(() => ink.remove(), 760);
  };

  const onPointerDown = event => {
    if (event.button != null && event.button !== 0) return;
    const target = event.target && event.target.closest ? event.target.closest(selector) : null;
    if (!target) return;
    spawnRipple(target, event);
  };

  document.addEventListener("pointerdown", onPointerDown, true);
})();

function cortexClampMotion(value, min, max) {
  return Math.max(min, Math.min(max, value || 0));
}

function cortexSetMotionVars(x, y, force) {
  const root = document.documentElement;
  root.style.setProperty('--cortex-tilt-x', x.toFixed(3));
  root.style.setProperty('--cortex-tilt-y', y.toFixed(3));
  const tiltMagnitude = Math.min(1, Math.abs(x) + Math.abs(y));
  const motionScale = 1 + Math.min(0.048, tiltMagnitude * 0.019 + Math.max(0, force || 0) * 0.005);
  root.style.setProperty('--cortex-motion-scale', motionScale.toFixed(3));
  root.style.setProperty('--cortex-depth-x', `${(x * 13).toFixed(2)}px`);
  root.style.setProperty('--cortex-depth-y', `${(y * 11).toFixed(2)}px`);
  root.style.setProperty('--cortex-wallpaper-shift-x', `${(x * -6.2).toFixed(2)}px`);
  root.style.setProperty('--cortex-wallpaper-shift-y', `${(y * -4.1).toFixed(2)}px`);
  root.style.setProperty('--cortex-card-tilt-x', `${(x * 2.05).toFixed(3)}deg`);
  root.style.setProperty('--cortex-card-tilt-y', `${(y * -1.8).toFixed(3)}deg`);
  root.style.setProperty('--cortex-card-shift-x', `${(x * 0.82).toFixed(3)}px`);
  root.style.setProperty('--cortex-card-shift-y', `${(y * 0.66).toFixed(3)}px`);
  root.style.setProperty('--cortex-button-tilt-x', `${(x * 1.58).toFixed(3)}deg`);
  root.style.setProperty('--cortex-button-tilt-y', `${(y * -1.34).toFixed(3)}deg`);
  root.style.setProperty('--cortex-button-shift-x', `${(x * 0.52).toFixed(3)}px`);
  root.style.setProperty('--cortex-button-shift-y', `${(y * 0.4).toFixed(3)}px`);
  root.style.setProperty('--cortex-control-tilt-x', `${(x * 1.34).toFixed(3)}deg`);
  root.style.setProperty('--cortex-control-tilt-y', `${(y * -1.16).toFixed(3)}deg`);
  root.style.setProperty('--cortex-control-shift-x', `${(x * 0.42).toFixed(3)}px`);
  root.style.setProperty('--cortex-control-shift-y', `${(y * 0.32).toFixed(3)}px`);
  root.style.setProperty('--cortex-shake-force', (force || 0).toFixed(3));

function CortexMotionSensorControl() {
  const supported = typeof window !== 'undefined' &&
    ('DeviceOrientationEvent' in window || 'DeviceMotionEvent' in window);
  const needsGesture = typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function';
  const [status, setStatus] = React.useState(supported ? 'idle' : 'unsupported');
  const motionRef = React.useRef({
    active:false,
    x:0,
    y:0,
    lastForce:0,
    lastShake:0,
    frame:null,
  });

  React.useEffect(() => {
    document.documentElement.dataset.motionSensor = status;
    document.documentElement.classList.toggle('cortex-sensor-active', status === 'active');
    document.documentElement.classList.toggle('cortex-sensor-unsupported', status === 'unsupported');
    return () => {
      document.documentElement.classList.remove('cortex-sensor-active', 'cortex-sensor-unsupported');
      document.documentElement.removeAttribute('data-motion-sensor');
    };
  }, [status]);

  React.useEffect(() => {
    return () => {
      if (motionRef.current.frame) cancelAnimationFrame(motionRef.current.frame);
      cortexSetMotionVars(0, 0, 0);
    };
  }, []);

  const attach = React.useCallback(() => {
    if (motionRef.current.active) return;
    motionRef.current.active = true;
    setStatus('active');

      const write = (nextX, nextY, force) => {
        if (motionRef.current.frame) cancelAnimationFrame(motionRef.current.frame);
        motionRef.current.frame = requestAnimationFrame(() => {
          motionRef.current.x = motionRef.current.x * 0.79 + nextX * 0.21;
          motionRef.current.y = motionRef.current.y * 0.79 + nextY * 0.21;
          cortexSetMotionVars(motionRef.current.x, motionRef.current.y, force || 0);
        });
      };

    const onOrientation = event => {
      const gamma = cortexClampMotion(event.gamma || 0, -32, 32);
      const beta = cortexClampMotion((event.beta || 0) - 20, -38, 38);
      const x = cortexClampMotion(gamma / 32, -1, 1);
      const y = cortexClampMotion(beta / 38, -1, 1);
      write(x, y, 0);
    };

    const onMotion = event => {
      const a = event.accelerationIncludingGravity || event.acceleration;
      if (!a) return;
      const force = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
      const delta = Math.abs(force - motionRef.current.lastForce);
      motionRef.current.lastForce = force;
      const now = performance.now();
      if (delta > 7.1 && now - motionRef.current.lastShake > 540) {
        motionRef.current.lastShake = now;
        const jolt = Math.min(delta / 15, 1);
        document.documentElement.style.setProperty('--cortex-shake-force', jolt.toFixed(3));
        document.documentElement.style.setProperty('--cortex-shake-scale', `${(1 + jolt * 0.042).toFixed(3)}`);
        document.documentElement.style.setProperty('--cortex-shake-x', `${(jolt * 4.0).toFixed(2)}px`);
        document.documentElement.style.setProperty('--cortex-shake-y', `${(jolt * -3.3).toFixed(2)}px`);
        document.documentElement.style.setProperty('--cortex-shake-x-neg', `${(jolt * -3.5).toFixed(2)}px`);
        document.documentElement.style.setProperty('--cortex-shake-y-pos', `${(jolt * 2.5).toFixed(2)}px`);
        document.documentElement.style.setProperty('--cortex-shake-rot', `${(jolt * 1.1).toFixed(3)}deg`);
        document.documentElement.style.setProperty('--cortex-shake-rot-neg', `${(jolt * -0.88).toFixed(3)}deg`);
        document.documentElement.style.setProperty('--cortex-shake-rest', `${(jolt * 0.34).toFixed(3)}deg`);
        document.documentElement.classList.add('cortex-device-shake');
        window.setTimeout(() => {
          document.documentElement.classList.remove('cortex-device-shake');
          document.documentElement.style.setProperty('--cortex-shake-scale', '1');
        }, 720);
      }
    };

    window.addEventListener('deviceorientation', onOrientation, { passive:true });
    window.addEventListener('devicemotion', onMotion, { passive:true });

    motionRef.current.detach = () => {
      window.removeEventListener('deviceorientation', onOrientation);
      window.removeEventListener('devicemotion', onMotion);
      motionRef.current.active = false;
      cortexSetMotionVars(0, 0, 0);
      document.documentElement.style.setProperty('--cortex-shake-scale', '1');
    };
  }, []);

  const enable = React.useCallback(async () => {
    if (!supported) {
      setStatus('unsupported');
      return;
    }
    try {
      const requests = [];
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        requests.push(DeviceOrientationEvent.requestPermission());
      }
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        requests.push(DeviceMotionEvent.requestPermission());
      }
      const results = await Promise.all(requests);
      if (results.some(result => result !== 'granted')) {
        setStatus('denied');
        return;
      }
      attach();
    } catch (error) {
      setStatus('denied');
    }
  }, [attach, supported]);

  const disable = React.useCallback(() => {
    if (motionRef.current.detach) motionRef.current.detach();
    setStatus(supported ? 'idle' : 'unsupported');
  }, [supported]);

  const label = status === 'active' ? 'Gyro on'
    : status === 'denied' ? 'Gyro off'
    : status === 'unsupported' ? 'No gyro'
    : needsGesture ? 'Enable gyro' : 'Gyro';
  const color = status === 'active' ? DL.teal
    : status === 'denied' ? DL.gold
    : status === 'unsupported' ? DL.mute
    : DL.accent;

  return React.createElement('button', {
    type:'button',
    className:'cortex-motion-sensor-control cortex-motion-press',
    onClick:status === 'active' ? disable : enable,
    title:status === 'active'

    style:{ '--sensor-color':color },
  },

    React.createElement('span', { className:'sensor-label-full' }, label),
    React.createElement('span', { className:'sensor-label-short' }, 'Gyro')

}

      startY = t.clientY;

      if (!active) return;

      const t = event.changedTouches && event.changedTouches[0];
